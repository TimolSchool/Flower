<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2f5d3a" />
    <title>Flower Care | Mon petit jardin</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <div>
          <h1>Fais grandir ta fleur.</h1>
        </div>
        <div class="sun-badge" aria-label="Vitalité de la fleur">
          <span aria-hidden="true">✿</span>
          <strong id="health">72</strong>
          <small>% vitalité</small>
        </div>
      </header>

      <main class="game" aria-label="Jeu de soin de la fleur">
        <section class="garden-card" aria-labelledby="flower-title">
          <div class="sky" aria-hidden="true">
            <span class="cloud cloud-one" data-cloud="one"></span>
            <span class="cloud cloud-two" data-cloud="two"></span>
            <span class="astro moon" id="astro" role="button" tabindex="0" aria-label="Lune à déplacer"></span>
          </div>
          <div class="flower-stage">
            <div class="seed" id="seed" aria-hidden="true"></div>
            <div class="sprout" id="sprout" aria-hidden="true">
              <span class="sprout-stem"></span>
              <span class="sprout-leaf sprout-leaf-left"></span>
              <span class="sprout-leaf sprout-leaf-right"></span>
            </div>
            <div class="flower" id="flower" aria-label="Ta fleur">
              <div class="stem"></div>
              <div class="flower-head">
                <div class="petals">
                  <span></span><span></span><span></span><span></span>
                  <span></span><span></span><span></span><span></span>
                </div>
                <div class="flower-center"></div>
              </div>
              <div class="leaf leaf-left"></div>
              <div class="leaf leaf-right"></div>
            </div>
            <div class="soil"></div>
          </div>
          <div class="garden-copy">
            <p class="status-label" id="status-label">Une graine attend</p>
            <h2 id="flower-title">Bonjour, petite graine.</h2>
            <p id="result" class="result" role="status" aria-live="polite">
              Un peu d’attention et elle s’épanouira.
            </p>
          </div>
        </section>

        <section class="card care-card" aria-labelledby="care-title">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Les soins du jour</p>
              <h2 id="care-title">De quoi a-t-elle besoin ?</h2>
            </div>
            <span class="streak" id="streak">0 soin</span>
          </div>

          <div class="meters">
            <div class="meter-row">
              <div class="meter-label"><span aria-hidden="true">💧</span><strong>Eau</strong><span id="water-value">0%</span></div>
              <div class="meter-track"><span id="water-bar" class="meter-fill water-fill"></span></div>
            </div>
            <div class="meter-row">
              <div class="meter-label"><span aria-hidden="true">☀</span><strong>Lumière</strong><span id="sun-value">0%</span></div>
              <div class="meter-track"><span id="sun-bar" class="meter-fill sun-fill"></span></div>
            </div>
          </div>

          <p class="tip" id="tip">Fusionne les deux nuages pour faire tomber la pluie.</p>
        </section>
      </main>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
