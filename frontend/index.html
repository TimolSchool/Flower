<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2f5d3a" />
    <title>Flower Care | Mon petit jardin</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <div>
          <p class="eyebrow">Jardin secret · Jour <span id="day">1</span></p>
          <h1>Fais grandir ta fleur.</h1>
        </div>
        <div class="sun-badge" aria-label="Vitalité de la fleur">
          <span aria-hidden="true">✿</span>
          <strong id="health">72</strong>
          <small>% vitalité</small>
        </div>
      </header>

      <main class="game" aria-label="Jeu de soin de la fleur">
        <section class="garden-card" aria-labelledby="flower-title">
          <div class="sky" aria-hidden="true">
            <span class="cloud cloud-one"></span>
            <span class="cloud cloud-two"></span>
            <span class="sun"></span>
          </div>
          <div class="flower-stage">
            <div class="flower-shadow"></div>
            <div class="flower" id="flower" aria-label="Ta fleur">
              <div class="petals">
                <span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span>
              </div>
              <div class="flower-center"></div>
              <div class="stem"></div>
              <div class="leaf leaf-left"></div>
              <div class="leaf leaf-right"></div>
            </div>
            <div class="soil"></div>
          </div>
          <div class="garden-copy">
            <p class="status-label" id="status-label">Elle a bonne mine</p>
            <h2 id="flower-title">Bonjour, petite fleur.</h2>
            <p id="result" class="result" role="status" aria-live="polite">
              Un peu d’attention et elle s’épanouira.
            </p>
          </div>
        </section>

        <section class="card care-card" aria-labelledby="care-title">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Les soins du jour</p>
              <h2 id="care-title">De quoi a-t-elle besoin ?</h2>
            </div>
            <span class="streak" id="streak">0 soin</span>
          </div>

          <div class="meters">
            <div class="meter-row">
              <div class="meter-label"><span aria-hidden="true">💧</span><strong>Eau</strong><span id="water-value">58%</span></div>
              <div class="meter-track"><span id="water-bar" class="meter-fill water-fill"></span></div>
            </div>
            <div class="meter-row">
              <div class="meter-label"><span aria-hidden="true">☀</span><strong>Lumière</strong><span id="sun-value">66%</span></div>
              <div class="meter-track"><span id="sun-bar" class="meter-fill sun-fill"></span></div>
            </div>
          </div>

          <div class="actions">
            <button class="action-button water-action" id="water-button" type="button">
              <span class="action-icon" aria-hidden="true">♒</span>
              <span><strong>Arroser</strong><small>+18 eau</small></span>
            </button>
            <button class="action-button light-action" id="sun-button" type="button">
              <span class="action-icon" aria-hidden="true">☼</span>
              <span><strong>Au soleil</strong><small>+16 lumière</small></span>
            </button>
          </div>
          <p class="tip" id="tip">Les deux jauges entre 40% et 85% donnent le meilleur équilibre.</p>
        </section>
      </main>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
